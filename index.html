<style>
/* To switch to the licensed Tufuli Arabic font:
   1) upload the .woff2 next to index.html  2) uncomment the @font-face  3) put "Tufuli Arabic" first in --font-display */
/* @font-face{font-family:"Tufuli Arabic";src:url("tufuli-arabic.woff2") format("woff2");font-display:swap} */
:root{
  --olive:#62664B; --tan:#AB8872; --cream:#EFECE4; --sage:#BBC2B6;
  --olive-deep:#3E4130; --ink:#2C2E22; --muted:#6B6E5E; --card:#FBFAF6; --line:#D9DCD2;
  --ok:#4F6B3A; --bad:#A2493A; --wait:#8A6A54; --off:#8C8E84;
  --font-display:"Baloo Bhaijaan 2","Readex Pro",system-ui,sans-serif;
  --font-body:"Readex Pro","Baloo Bhaijaan 2",system-ui,"Segoe UI",Tahoma,sans-serif;
  --r:16px; color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tan);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.25;text-wrap:balance;color:var(--olive-deep)}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:16px 32px;display:flex;flex-direction:column;gap:16px}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--cream);border-bottom:1px solid var(--line)}
.top .in{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.brand .word{font-family:var(--font-display);font-weight:800;font-size:1.65rem;color:var(--olive);line-height:1}
.brand .sub{font-size:.72rem;color:var(--muted);display:block;line-height:1.2}
.navbtns{display:flex;gap:6px;align-items:center}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:10px 16px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-decoration:none;color:var(--ink);font-weight:600;min-height:42px}
.btn:hover{border-color:var(--sage)}
.btn.pri{background:var(--olive);border-color:var(--olive);color:#fff}
.btn.pri:hover{background:var(--olive-deep)}
.btn.acc{background:var(--tan);border-color:var(--tan);color:#fff}
.btn.wa{background:#1F7A45;border-color:#1F7A45;color:#fff}
.btn.bad{color:var(--bad);border-color:var(--bad);background:var(--card)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.88rem}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:.72rem;font-weight:700}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.stack>*,.wrap>*,.card>*{min-width:0}
@media (max-width:440px){.brand .sub{display:none}}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:440px){.grid2{grid-template-columns:1fr}}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
/* form */
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);font-size:1rem;width:100%;min-width:0}
label.f textarea{min-height:90px;resize:vertical}
.err{color:var(--bad);font-size:.85rem;min-height:1.3em}
/* welcome */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-block:24px 8px}
.hero h1{font-size:2.6rem;color:var(--olive)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.choice{grid-template-columns:1fr}}
.choice button{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 14px;border-radius:20px;border:2px solid var(--line);background:var(--card);cursor:pointer;text-align:center}
.choice button:hover{border-color:var(--olive)}
.choice .t{font-family:var(--font-display);font-weight:700;font-size:1.3rem;color:var(--olive-deep)}
.choice .d{font-size:.85rem;color:var(--muted)}
.ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--cream)}
/* tabs & chips */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;white-space:nowrap;cursor:pointer;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{background:var(--olive);color:#fff;border-color:var(--olive)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;white-space:nowrap;cursor:pointer;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--olive);color:#fff;border-color:var(--olive)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.status{display:inline-block;font-size:.78rem;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid}
.st-pending{color:var(--wait);border-color:var(--tan);background:#F4ECE6}
.st-accepted{color:var(--ok);border-color:#9FB08E;background:#EEF2E8}
.st-done{color:var(--olive-deep);border-color:var(--sage);background:#ECEFE9}
.st-rejected,.st-suspended{color:var(--bad);border-color:#D3A69E;background:#F6EAE7}
.st-cancelled{color:var(--off);border-color:var(--line);background:#F1F1EE}
.st-active{color:var(--ok);border-color:#9FB08E;background:#EEF2E8}
.st-new{color:var(--wait);border-color:var(--tan);background:#F4ECE6}
.st-resolved{color:var(--off);border-color:var(--line);background:#F1F1EE}
/* shop list */
.search{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 12px}
.search input{border:0;background:transparent;flex:1;min-width:0;padding:10px 0;outline:none}
.shop{display:flex;gap:14px;align-items:center;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer}
.shop:hover{border-color:var(--olive)}
.shop .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.shop .name{font-weight:600;font-size:1.05rem;color:var(--olive-deep)}
.av{width:62px;height:62px;border-radius:14px;flex:none;object-fit:cover;background:var(--olive);color:var(--cream);display:grid;place-items:center;font-family:var(--font-display);font-size:1.6rem;font-weight:800}
.stars{color:var(--tan);letter-spacing:1px;font-size:.92rem}
.price{color:var(--tan);font-weight:600}
.empty{background:var(--card);border:1px dashed var(--sage);border-radius:var(--r);padding:24px;text-align:center;color:var(--muted)}
.hero-img{width:100%;aspect-ratio:16/8;max-width:100%;border-radius:var(--r);object-fit:cover;background:var(--olive);display:grid;place-items:center;color:var(--cream);font-family:var(--font-display);font-size:3.4rem;font-weight:800}
.svc{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.svc input{width:20px;height:20px;accent-color:var(--olive);flex:none}
.svc .n{flex:1;min-width:0}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.slots .chip{text-align:center}
/* ticket */
.ticket{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ticket .tp{padding:16px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;background:var(--olive);color:var(--cream)}
.ticket .when{font-family:var(--font-display);font-size:1.9rem;font-weight:800;line-height:1.1}
.ticket .perf{height:0;border-top:2px dashed var(--sage);margin-inline:14px}
.ticket dl{margin:0;padding:12px 16px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.93rem}
.ticket dt{color:var(--muted)} .ticket dd{margin:0;min-width:0}
.total{font-weight:700;color:var(--tan);font-variant-numeric:tabular-nums}
/* lists */
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.item .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.item .ttl{font-weight:600;color:var(--olive-deep)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.slotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.sl{border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 10px;display:flex;flex-direction:column;gap:4px;text-align:center}
.sl.closed{background:#F1F1EE;color:var(--off)}
.sl.full{background:#F4ECE6}
.sl .t{font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .v{font-family:var(--font-display);font-size:1.8rem;font-weight:800;color:var(--olive);line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:.82rem;color:var(--muted)}
.hours{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:center}
.hours label.f{flex-direction:row;align-items:center;gap:6px;color:var(--ink)}
.svc-edit{display:grid;grid-template-columns:1fr 90px 80px auto;gap:6px;align-items:end}
@media (max-width:480px){.svc-edit{grid-template-columns:1fr 1fr}.svc-edit>label:first-child{grid-column:1/-1}}
.note{background:#F4ECE6;border:1px solid #E2D2C6;border-radius:12px;padding:12px;font-size:.9rem;color:var(--olive-deep)}
.note.ok{background:#EEF2E8;border-color:#CFD9C4}
/* install-on-phone banner */
.install{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--sage);border-radius:var(--r);padding:12px}
.install svg{flex:none}
.install .it{flex:1;min-width:150px;display:flex;flex-direction:column;gap:2px}
.install .it strong{color:var(--olive-deep)}
ol.steps{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:8px}
.kbd{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 8px;font-weight:600}
/* footer */
footer{margin-top:8px;border-top:1px solid var(--line);background:#E6E3D9}
footer .in{max-width:680px;margin:0 auto;padding:20px 16px 28px;display:flex;flex-direction:column;gap:10px}
footer h3{font-size:1.15rem}
/* sheet + toast */
.scrim{position:fixed;inset:0;background:rgb(44 46 34 / .45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--cream);width:100%;max-width:680px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:720px){.scrim{align-items:center}.sheet{border-radius:22px;max-height:88%}}
.sheet .sh{position:sticky;top:0;background:var(--cream);display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);z-index:1}
.sheet .sb{padding:16px;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline:16px;max-width:440px;margin:0 auto;background:var(--olive-deep);color:var(--cream);padding:12px 16px;border-radius:14px;z-index:40;text-align:center;font-size:.92rem;box-shadow:0 6px 20px rgb(0 0 0 / .18)}
.spinner{width:28px;height:28px;border:3px solid var(--sage);border-top-color:var(--olive);border-radius:50%;animation:spin 1s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t th,table.t td{padding:8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
table.t th{color:var(--muted);font-weight:500}
.scrollx{overflow-x:auto}
</style>
</head>

const firebaseConfig = {

const SDK = "https://www.gstatic.com/firebasejs/10.12.2/";

const CONFIGURED = !String(firebaseConfig.apiKey).startsWith("PASTE");
const $ = (s, r) => (r || document).querySelector(s);

const S = {

  myBookings: [], myReviews: new Set(), shopBookings: [], pendingCount: 0,

/* ---------------- small helpers ---------------- */
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
const nf = new Intl.NumberFormat("ar-EG");
function n(x) { return nf.format(Number(x) || 0); }
function money(x) { return n(x) + " جنيه"; }
function toLatin(s) { return String(s || "").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)); }
function normPhone(p) { p = toLatin(p).replace(/[^\d+]/g, ""); if (p.startsWith("+20")) p = "0" + p.slice(3); else if (p.startsWith("0020")) p = "0" + p.slice(4); else if (p.startsWith("20") && p.length === 12) p = "0" + p.slice(2); return p; }
function validPhone(p) { return /^01[0125]\d{8}$/.test(p); }
function waLink(p, text) { p = normPhone(p); if (!p) return ""; return "https://wa.me/2" + p + (text ? "?text=" + encodeURIComponent(text) : ""); }
const DAYS = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];          // JS getDay()
const ISO_DAYS = { "1": "الاثنين", "2": "الثلاثاء", "3": "الأربعاء", "4": "الخميس", "5": "الجمعة", "6": "السبت", "7": "الأحد" };
const WEEK_ORDER = ["6", "7", "1", "2", "3", "4", "5"];   // Egyptian week starts Saturday
const MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function isoDow(d) { return String(((d.getDay() + 6) % 7) + 1); }
function dkey(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function parseKey(k) { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); }
function fmtDate(k) { const d = parseKey(k); return DAYS[d.getDay()] + " " + n(d.getDate()) + " " + MONTHS[d.getMonth()]; }
function dayLabel(k) { const t = dkey(new Date()); const tm = new Date(); tm.setDate(tm.getDate() + 1); if (k === t) return "النهارده"; if (k === dkey(tm)) return "بكره"; return DAYS[parseKey(k).getDay()]; }
function mins(t) { const [h, m] = String(t).split(":").map(Number); return h * 60 + (m || 0); }
function hhmm(m) { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); }
function fmtT(t) { const m = mins(t), h = Math.floor(m / 60), mm = m % 60; return n(h % 12 || 12) + ":" + (mm < 10 ? "٠" : "") + n(mm) + " " + (h >= 12 ? "م" : "ص"); }
const ALL_TIMES = Array.from({ length: 48 }, (_, i) => hhmm(i * 30));
function slotId(date, time) { return date + "_" + time.replace(":", ""); }
// slot times for one weekday, 30-minute steps; a window may run past midnight
function slotTimes(h) {
  if (!h || !h.open) return [];
  const a = mins(h.from), b = mins(h.to), out = [];
  const end = b > a ? b : b + 1440;
  for (let m = a; m < end; m += 30) out.push(hhmm(m));
  return out;
}
function slotDateTime(date, time, h) { const d = parseKey(date); const m = mins(time); if (h && mins(h.to) <= mins(h.from) && m < mins(h.from)) d.setDate(d.getDate() + 1); d.setHours(Math.floor(m / 60), m % 60, 0, 0); return d; }
function nextDays(count) { const out = [], d = new Date(); d.setHours(0, 0, 0, 0); for (let i = 0; i < count; i++) { const x = new Date(d); x.setDate(d.getDate() + i); out.push(dkey(x)); } return out; }
function stars(avg) { const r = Math.round(avg); return "★★★★★".slice(0, r) + "☆☆☆☆☆".slice(0, 5 - r); }
function ratingOf(s) { return s.ratingCount ? s.ratingSum / s.ratingCount : 0; }
function initials(name) { const w = String(name || "").replace(/^(صالون|حلاق|محل|استوديو)\s+/, "").trim().replace(/^ال(?=\S)/, ""); return w.charAt(0) || "د"; }
function avatar(s, cls) { return s.photo ? `<img class="${cls}" src="${esc(s.photo)}" alt="">` : `<div class="${cls}" aria-hidden="true">${esc(initials(s.name))}</div>`; }
function minPrice(s) { const p = (s.services || []).map(x => +x.price || 0).filter(Boolean); return p.length ? Math.min(...p) : 0; }
const STATUS = { pending: "في انتظار التأكيد", accepted: "متأكد", rejected: "مرفوض", cancelled: "ملغي", done: "خلص", active: "شغال", suspended: "موقوف", new: "جديد", resolved: "اتحل" };
function stBadge(s, label) { return `<span class="status st-${esc(s)}">${esc(label || STATUS[s] || s)}</span>`; }
function toast(t) { const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 3200); }
function errText(e) {
  const c = (e && e.code) || "";
  if (c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found") || c.includes("invalid-email")) return "رقم الموبايل أو كلمة السر غلط.";
  if (c.includes("email-already-in-use")) return "الرقم ده عليه حساب بالفعل. سجّل دخول بدل كده.";
  if (c.includes("weak-password")) return "كلمة السر لازم تبقى ٦ حروف أو أرقام على الأقل.";
  if (c.includes("too-many-requests")) return "محاولات كتير. استنى شوية وجرّب تاني.";
  if (c.includes("network") || c.includes("unavailable")) return "مفيش اتصال بالإنترنت. اتأكد من النت وجرّب تاني.";
  if (c.includes("permission-denied")) return "العملية دي مش مسموحة لحسابك.";
  if (e && e.userMsg) return e.userMsg;
  return "حصلت مشكلة. جرّب تاني بعد شوية.";
}
function userErr(msg) { const e = new Error(msg); e.userMsg = msg; return e; }
function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function copyText(t) { try { navigator.clipboard.writeText(t).then(() => toast("اتنسخ"), () => toast(t)); } catch (e) { toast(t); } }
function beep() { try { const C = window.AudioContext || window.webkitAudioContext; const c = new C(); [0, .18].forEach(d => { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; g.gain.value = .12; o.connect(g); g.connect(c.destination); o.start(c.currentTime + d); o.stop(c.currentTime + d + .12); }); } catch (e) {} }
function notify(title, body) { beep(); toast(title + (body ? " — " + body : "")); try { if ("Notification" in window && Notification.permission === "granted") new Notification(title, { body, icon: $("link[rel=icon]").href }); } catch (e) {} }
async function compressImage(file, max = 560) {
  const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(userErr("الصورة دي مش مدعومة. جرّب صورة JPG أو PNG.")); i.src = url; });
  const sc = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
  c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", .7);
}

/* ---------------- barber invite links: ?invite=barber&name=...&area=...&wa=... ---------------- */
function getInvite() { try { return JSON.parse(load("dawrak.invite") || "null"); } catch (e) { return null; } }
(function captureInvite() {
  try {
    const q = new URLSearchParams(location.search);
    if (q.get("invite") !== "barber") return;
    const inv = { name: (q.get("name") || "").slice(0, 60), area: AREAS.includes(q.get("area")) ? q.get("area") : "", wa: normPhone(q.get("wa") || "") };
    if (!validPhone(inv.wa)) inv.wa = "";
    store("dawrak.invite", JSON.stringify(inv)); store("dawrak.role", "barber");
    history.replaceState(null, "", location.pathname);
  } catch (e) {}
})();

let installEvt = null;   // Android/Chrome install prompt, kept until the user taps "نزّل"
function isStandalone() { try { return matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; } catch (e) { return false; } }
function isIOS() { const u = navigator.userAgent; return /iphone|ipad|ipod/i.test(u) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); }
function inAppBrowser() { return /FBAN|FBAV|FB_IAB|Instagram|WhatsApp|Snapchat|TikTok|musical_ly|Line\//i.test(navigator.userAgent); }
function canShowInstall() { return !isStandalone(); }
function installBanner() {

}

}

/* ---------------- navigation ---------------- */
function go(view, params = {}, push = true) {
  S.viewUnsubs.forEach(u => { try { u(); } catch (e) {} }); S.viewUnsubs = [];
  S.view = view; S.params = params;
  if (push) { try { history.pushState({ view, params }, "", "#" + view); } catch (e) {} }
  window.scrollTo(0, 0);
  render();
}
window.addEventListener("popstate", e => { const st = e.state; if (st && st.view) go(st.view, st.params || {}, false); else go(homeView(), {}, false); });
function homeView() {
  if (!S.user) return load("dawrak.role") ? (load("dawrak.role") === "customer" ? "home" : "auth") : "welcome";
  if (!S.profile) return "profile";
  if (S.profile.role === "barber") return "barber";
  return "home";
}

  const v = S.view, views = { welcome: vWelcome, auth: vAuth, profile: vProfile, home: vHome, shop: vShop, booked: vBooked, mybookings: vMyBookings, barber: vBarber, admin: vAdmin, account: vAccount };
  // guards
  if ((v === "mybookings" || v === "account") && !S.user) return go("auth", { role: "customer", next: v }, false);
  if (v === "barber" && (!S.profile || S.profile.role !== "barber")) return go(homeView(), {}, false);

    <form id="authform" novalidate class="card" style="padding:0;border:0;background:none">
      ${mode === "register" ? `<label class="f">${isB ? "اسمك" : "الاسم"}<input id="a-name" autocomplete="name" required maxlength="60"></label>` : ""}
      <label class="f">رقم الموبايل<input id="a-phone" inputmode="tel" autocomplete="tel" dir="ltr" placeholder="01xxxxxxxxx" required value="${inv && inv.wa ? esc(inv.wa) : ""}"></label>
      <label class="f">كلمة السر<input id="a-pass" type="password" autocomplete="${mode === "register" ? "new-password" : "current-password"}" dir="ltr" minlength="6" required></label>
      <div class="err" id="a-err" role="alert"></div>
      <button class="btn pri block" type="submit" id="a-go">${mode === "register" ? "اعمل الحساب" : "ادخل"}</button>
      ${mode === "login" ? `<p class="muted small" style="margin:0">نسيت كلمة السر؟ كلّم الدعم على واتساب <span class="num">${esc(S.settings.supportWhatsapp)}</span>.</p>` : `<p class="muted small" style="margin:0">رقمك هيظهر للحلاق اللي تحجز عنده بس، عشان يأكد معاك.</p>`}
    </form>
  </div>
  <div class="row between">
    <button class="btn ghost sm" data-act="pickrole" data-role="${isB ? "customer" : "barber"}">${isB ? "مش حلاق؟ ادخل كزبون" : "إنت حلاق؟ ادخل من هنا"}</button>
    ${!isB ? `<button class="btn sm" data-act="go" data-v="home">اتفرّج على الحلاقين الأول</button>` : ""}
  </div></div>`;
  $("#authform").addEventListener("submit", async e => {
    e.preventDefault();
    const err = $("#a-err"), btn = $("#a-go"); err.textContent = "";
    const phone = normPhone($("#a-phone").value), pass = $("#a-pass").value, name = mode === "register" ? $("#a-name").value.trim() : "";
    if (mode === "register" && name.length < 2) { err.textContent = "اكتب اسمك."; return; }
    if (!validPhone(phone)) { err.textContent = "رقم الموبايل لازم يبقى ١١ رقم ويبدأ بـ 01."; return; }
    if (pass.length < 6) { err.textContent = "كلمة السر لازم تبقى ٦ حروف أو أرقام على الأقل."; return; }
    btn.disabled = true; btn.textContent = "لحظة…";

    S.afterLogin = S.params.next || null; S.afterLoginParams = S.params.nextParams || {};
    try {
      const email = phone + "@" + PHONE_DOMAIN;

        const cred = await fb.createUserWithEmailAndPassword(auth, email, pass);
        await createProfile(cred.user.uid, S.pendingProfile);

  });
}

function availableTimes(day) {
  if (!bk) return [];
  const h = bk.s.hours[isoDow(parseKey(day))], now = Date.now() + 15 * 60000;
  return slotTimes(h).filter(t => {
    const sd = bk.slots[slotId(day, t)];
    const cap = sd && typeof sd.cap === "number" ? sd.cap : bk.s.capacity;
    if (sd && sd.closed) return false;
    if (sd && sd.count >= cap) return false;
    return slotDateTime(day, t, h).getTime() > now;
  });
}
function drawDays() {
  $("#days").innerHTML = bk.days.map(k => { const h = bk.s.hours[isoDow(parseKey(k))]; const off = !h || !h.open; return `<button class="chip" data-act="day" data-d="${k}" aria-pressed="${bk.day === k}"${off ? " disabled title=\"إجازة\"" : ""}>${dayLabel(k)} ${n(parseKey(k).getDate())}</button>`; }).join("");
}
function subscribeSlots() {
  S.viewUnsubs.forEach(u => u()); S.viewUnsubs = [];
  const day = bk.day; bk.slots = {};
  $("#slots").innerHTML = `<div class="muted small">بيحمّل المواعيد…</div>`;
  const u = fb.onSnapshot(fb.query(fb.collection(db, "shops", bk.s.id, "slots"), fb.where("date", "==", day)), snap => {
    if (!bk || bk.day !== day) return;
    bk.slots = {}; snap.forEach(d => { bk.slots[d.id] = d.data(); });
    drawSlots();
  }, e => { $("#slots").innerHTML = `<div class="empty">${esc(errText(e))}</div>`; });
  S.viewUnsubs.push(u);
}
function drawSlots() {
  const ts = availableTimes(bk.day);
  if (bk.time && !ts.includes(bk.time)) { if (S.params.time === bk.time) toast("المعاد اللي اخترته اتحجز. اختار معاد تاني."); bk.time = null; }
  $("#slots").innerHTML = ts.length ? ts.map(t => `<button class="chip" data-act="slot" data-t="${t}" aria-pressed="${bk.time === t}">${fmtT(t)}</button>`).join("") : `<div class="empty" style="grid-column:1/-1">مفيش مواعيد فاضية في اليوم ده. اختار يوم تاني.</div>`;
  drawSummary();
}
function chosenServices() { return (bk.s.services || []).filter((_, i) => bk.svc.has(i)); }
function drawSummary() {

async function confirmBooking() {
  const err = $("#bk-err"), btn = $("#bk-go"); err.textContent = "";
  const sv = chosenServices();
  if (!sv.length) { err.textContent = "اختار خدمة واحدة على الأقل."; return; }
  if (!bk.time) { err.textContent = "اختار الساعة."; return; }
  if (!S.user) { go("auth", { role: "customer", next: "shop", nextParams: { id: bk.s.id, day: bk.day, time: bk.time, svc: [...bk.svc], note: bk.note } }); return; }
  if (!S.profile || S.profile.role !== "customer") { err.textContent = "الحجز من حساب زبون بس."; return; }
  if (S.profile.status !== "active") { err.textContent = "حسابك موقوف. كلّم الدعم."; return; }
  btn.disabled = true; btn.textContent = "بيتحجز…";
  const s = bk.s, day = bk.day, time = bk.time, total = sv.reduce((a, x) => a + (+x.price || 0), 0);
  try {
    const bref = fb.doc(fb.collection(db, "bookings"));
    const sref = fb.doc(db, "shops", s.id, "slots", slotId(day, time));
    await fb.runTransaction(db, async tx => {
      const shopSnap = await tx.get(fb.doc(db, "shops", s.id));
      const sd = await tx.get(sref);
      const shop = shopSnap.data();
      if (!shop || shop.status !== "active") throw userErr("المحل ده مش متاح دلوقتي.");
      if (!slotTimes(shop.hours[isoDow(parseKey(day))]).includes(time)) throw userErr("المعاد ده مش ضمن مواعيد الحلاق.");
      if (sd.exists()) {
        const d = sd.data(), cap = typeof d.cap === "number" ? d.cap : shop.capacity;
        if (d.closed) throw userErr("الحلاق قفل المعاد ده. اختار معاد تاني.");
        if (d.count >= cap) throw userErr("المعاد ده اتحجز خلاص. اختار معاد تاني.");
        tx.update(sref, { count: d.count + 1, lastBooking: bref.id });
      } else {
        tx.set(sref, { date: day, time, count: 1, closed: false, lastBooking: bref.id });
      }
      tx.set(bref, {
        shopId: s.id, shopName: shop.name, customerId: S.user.uid, customerName: S.profile.name, customerPhone: S.profile.phone,
        services: sv.map(x => ({ name: x.name, price: +x.price || 0, mins: +x.mins || 0 })), total,
        date: day, time, status: "pending", payment: "cash", note: (bk.note || "").slice(0, 140), createdAt: fb.serverTimestamp()
      });
    });
    go("booked", { id: bref.id, shopName: s.name, wa: s.whatsapp || "", day, time, total, svc: sv.map(x => x.name).join(" + ") });
  } catch (e) { err.textContent = errText(e); btn.disabled = false; btn.textContent = "أكّد الحجز"; }
}

async function cancelBooking(id) {

function openSheet(title, body) {

  document.body.appendChild(s); document.body.style.overflow = "hidden";

/* ---------------- events ---------------- */
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset.svc != null && bk) { const i = +t.dataset.svc; t.checked ? bk.svc.add(i) : bk.svc.delete(i); drawSummary(); }
  if (t.dataset.actChange === "adminbk") {
    const b = A.data.bookings.find(x => x.id === t.dataset.id); const prev = b.status, nx = t.value;
    try {
      await fb.runTransaction(db, async tx => {
        const sref = fb.doc(db, "shops", b.shopId, "slots", slotId(b.date, b.time)); const sd = await tx.get(sref);
        tx.update(fb.doc(db, "bookings", b.id), { status: nx, updatedAt: fb.serverTimestamp() });
        const wasHolding = ["pending", "accepted", "done"].includes(prev), holds = ["pending", "accepted", "done"].includes(nx);
        if (sd.exists() && wasHolding !== holds) tx.update(sref, { count: Math.max(0, (sd.data().count || 0) + (holds ? 1 : -1)) });
      });
      b.status = nx; toast("اتغيّرت حالة الحجز.");
    } catch (ex) { t.value = prev; toast(errText(ex)); }
  }
});

/* ---------------- live listeners per role ---------------- */
function stopRoleListeners() { S.roleUnsubs.forEach(u => { try { u(); } catch (e) {} }); S.roleUnsubs = []; S.myBookings = []; S.shopBookings = []; S.pendingCount = 0; S.knownPending = null; S.shop = undefined; S.myReviews = new Set(); }
function startRoleListeners() {
  stopRoleListeners();
  if (!S.profile) return;
  const uid = S.user.uid;
  if (S.profile.role === "customer") {
    let first = true; const prev = {};
    S.roleUnsubs.push(fb.onSnapshot(fb.query(fb.collection(db, "bookings"), fb.where("customerId", "==", uid)), snap => {
      S.myBookings = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      S.myBookings.forEach(b => { if (!first && prev[b.id] && prev[b.id] !== b.status && (b.status === "accepted" || b.status === "rejected")) notify(b.status === "accepted" ? "الحلاق أكّد حجزك ✔" : "الحلاق رفض الحجز", b.shopName + " · " + fmtDate(b.date) + " " + fmtT(b.time)); prev[b.id] = b.status; });
      first = false;
      if (S.view === "mybookings") vMyBookings();
    }, () => {}));
    fb.getDocs(fb.query(fb.collection(db, "reviews"), fb.where("customerId", "==", uid))).then(s => { s.forEach(d => S.myReviews.add(d.id)); if (S.view === "mybookings") vMyBookings(); }).catch(() => {});
  }
  if (S.profile.role === "barber") {
    S.roleUnsubs.push(fb.onSnapshot(fb.doc(db, "shops", uid), d => {
      S.shop = d.exists() ? { id: d.id, ...d.data() } : null;
      if (S.view === "barber" && !(S.params.tab === "services" || S.params.tab === "shop") ) vBarber();
      else if (S.view === "barber" && S.shop === null) vBarber();
      else if (S.view === "barber" && S.shop && !$("#bpanel")) vBarber();
    }, () => { S.shop = null; if (S.view === "barber") vBarber(); }));
    S.roleUnsubs.push(fb.onSnapshot(fb.query(fb.collection(db, "bookings"), fb.where("shopId", "==", uid)), snap => {
      S.shopBookings = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      const pend = S.shopBookings.filter(b => b.status === "pending");
      if (S.knownPending) pend.filter(b => !S.knownPending.has(b.id)).forEach(b => notify("طلب حجز جديد", b.customerName + " · " + fmtDate(b.date) + " " + fmtT(b.time)));
      S.knownPending = new Set(pend.map(b => b.id));
      S.pendingCount = pend.length; renderTop();
      try { document.title = (pend.length ? "(" + pend.length + ") " : "") + "دورك"; } catch (e) {}
      if (S.view === "barber") { const tab = S.params.tab || "requests"; if (tab === "requests") vBarber(); else if (tab === "schedule" && S.schedDraw) S.schedDraw(); }
    }, () => {}));
  }
}

/* ---------------- boot ---------------- */
async function boot() {
  if (!CONFIGURED) { render(); return; }
  try {
    const [app, au, fs] = await Promise.all([import(SDK + "firebase-app.js"), import(SDK + "firebase-auth.js"), import(SDK + "firebase-firestore.js")]);
    fb = { ...au, ...fs };
    const fapp = app.initializeApp(firebaseConfig);
    auth = au.getAuth(fapp); db = fs.getFirestore(fapp);
  } catch (e) {
    main.innerHTML = `<div class="wrap"><div class="empty">مش قادرين نوصل للسيرفر. اتأكد من النت وافتح الصفحة تاني.</div><button class="btn pri" onclick="location.reload()">جرّب تاني</button></div>`; return;
  }
  fb.getDoc(fb.doc(db, "settings", "app")).then(d => { if (d.exists()) { S.settings = { ...DEFAULTS, ...d.data() }; renderFoot(); } }).catch(() => {});
  fb.onAuthStateChanged(auth, async user => {
    S.user = user; S.profile = null; S.isAdmin = false; stopRoleListeners();
    if (user) {
      try {
        const [p, a] = await Promise.all([fb.getDoc(fb.doc(db, "users", user.uid)), fb.getDoc(fb.doc(db, "admins", user.uid)).catch(() => null)]);
        if (p.exists()) S.profile = p.data();
        else if (S.pendingProfile) S.profile = { ...S.pendingProfile, status: "active" };
        S.isAdmin = !!(a && a.exists());
      } catch (e) { if (S.pendingProfile) S.profile = { ...S.pendingProfile, status: "active" }; }
      S.pendingProfile = null;
      if (S.profile) { store("dawrak.role", S.profile.role); startRoleListeners(); }
    }
    const wasReady = S.ready; S.ready = true;
    if (S.afterLogin && S.profile) { const v = S.afterLogin, p = S.afterLoginParams; S.afterLogin = null; go(v, p); return; }
    if (!wasReady) {
      const h = (location.hash || "").slice(1);
      const v = ["home", "mybookings", "barber", "admin", "account"].includes(h) ? h : homeView();
      try { history.replaceState({ view: v, params: {} }, "", "#" + v); } catch (e) {}
      go(v, {}, false);
    } else if (S.view === "auth" || S.view === "welcome" || S.view === "profile" || !user) go(homeView());
    else render();
  });
}
render(); boot();
</script>

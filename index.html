<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="احجز دورك (Dorak): احجز ملعب بادل أو كورة، حلاق، كوافير، بلايستيشن أو سيبر في دمياط الجديدة">
<meta name="theme-color" content="#0B1E48">
<title>احجز دورك · Dorak</title>
<link rel="icon" href="icon-192.png" type="image/png">
<!-- Home-screen app (since v2.2): these files sit next to index.html on GitHub -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="احجز دورك">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Brand font: Cairo (free, SIL Open Font License) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<style>
:root{
  --navy:#0B1E48; --navy-deep:#060F2A; --royal:#12306A; --navy-soft:#E9EEF8; --gold:#D9AE4A; --gold-deep:#B07F28; --gold-light:#FBE7A1; --gold-soft:#FBF5E4;
  --gold-grad:linear-gradient(135deg,#FBE7A1,#E2B857 45%,#B07F28);
  --bg:#F8F9FA; --ink:#14213A; --muted:#5F6B7D; --card:#FFFFFF; --line:#E2E7EF; --mist:#C9D3E1;
  --ok:#2F7A4D; --bad:#B03A35; --wait:#9A7417; --off:#8A93A3;
  --font-display:"Cairo",system-ui,"Segoe UI",Tahoma,sans-serif;
  --font-body:"Cairo",system-ui,"Segoe UI",Tahoma,sans-serif;
  --r:18px; --shadow:0 6px 22px rgb(11 30 72 / .08); color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.65;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.3;text-wrap:balance;color:var(--navy);font-weight:800}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:16px 32px;display:flex;flex-direction:column;gap:16px}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(120deg,var(--navy-deep),var(--navy) 55%,var(--royal));border-bottom:0;box-shadow:0 2px 0 0 #B07F28,0 6px 18px rgb(6 15 42 / .25)}
.top::after{content:"";position:absolute;inset-inline:0;bottom:-2px;height:2px;background:var(--gold-grad)}
.top .in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:start}
.brand .word{font-family:var(--font-display);font-weight:800;font-size:1.35rem;color:#fff;line-height:1.1;display:block}
.brand .sub{font-size:.72rem;color:var(--gold-light);display:block;line-height:1.3;font-weight:700;letter-spacing:1px;white-space:nowrap}
.navbtns{display:flex;gap:6px;align-items:center}
.top .btn{background:transparent;border-color:rgb(255 255 255 / .28);color:#fff}
.top .btn:hover{border-color:var(--gold)}
.top .btn.pri{background:var(--gold-grad);border-color:var(--gold);color:var(--navy-deep)}
.top .btn.ghost{border-color:transparent}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:10px 16px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-decoration:none;color:var(--navy);font-weight:700;min-height:42px}
.btn:hover{border-color:var(--mist)}
.btn.pri{background:var(--gold-grad);border-color:var(--gold-deep);color:var(--navy-deep);box-shadow:0 3px 10px rgb(176 127 40 / .25)}
.btn.pri:hover{filter:brightness(1.04)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.acc{background:var(--navy);border-color:var(--navy);color:var(--gold)}
.btn.wa{background:#1F7A45;border-color:#1F7A45;color:#fff}
.btn.bad{color:var(--bad);border-color:#E3B9B6;background:var(--card)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.switch{border-radius:999px;border:1.5px solid var(--gold);color:var(--gold-deep);background:transparent}
.btn.switch:hover{background:var(--gold-soft)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.88rem}
.btn.lg{padding:14px 20px;min-height:52px;font-size:1.05rem}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:.72rem;font-weight:700}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.en{font-family:"Cairo",system-ui,sans-serif;direction:ltr;unicode-bidi:isolate;letter-spacing:.3px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.stack>*,.wrap>*,.card>*{min-width:0}
@media (max-width:440px){.brand .sub{font-size:.7rem}}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:440px){.grid2{grid-template-columns:1fr}}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.phone{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--navy);direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;letter-spacing:.4px}
.phone svg{flex:none}
/* form */
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted);min-width:0;font-weight:600}
label.f input,label.f select,label.f textarea{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);font-size:1rem;width:100%;min-width:0;font-weight:400}
label.f input:focus,label.f select:focus,label.f textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgb(212 175 55 / .18)}
label.f textarea{min-height:90px;resize:vertical}
.err{color:var(--bad);font-size:.85rem;min-height:1.3em}
/* hero + welcome */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:26px 20px;background:radial-gradient(120% 140% at 100% 0%,#16407A 0%,var(--navy) 45%,var(--navy-deep) 100%);color:#fff;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgb(7 31 66 / .25)}
.hero::after{content:"";position:absolute;inset-inline-start:-60px;bottom:-80px;width:220px;height:220px;border-radius:50%;border:2px solid rgb(212 175 55 / .35)}
.hero h1{font-size:2rem;color:#fff;line-height:1.25}
.hero h1 .g{color:var(--gold);display:block}
.hero p{margin:0;color:#D5DEEC;max-width:36ch}
.hero.center{align-items:center;text-align:center}
.hero.center p{margin-inline:auto}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.choice{grid-template-columns:1fr}}
.choice button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;text-align:center;box-shadow:var(--shadow)}
.choice button:hover{border-color:var(--gold)}
.choice .t{font-family:var(--font-display);font-weight:800;font-size:1.25rem;color:var(--navy)}
.choice .t .en{display:block;font-size:.85rem;color:var(--gold-deep);font-weight:700}
.choice .d{font-size:.85rem;color:var(--muted)}
.ico{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:var(--navy);color:var(--gold)}
/* categories */
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:480px){.cats{grid-template-columns:repeat(2,1fr)}}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:center;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.cat:hover{border-color:var(--gold);transform:translateY(-2px)}
.cat .ci{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#16407A,var(--navy-deep));color:var(--gold);box-shadow:inset 0 0 0 2px rgb(212 175 55 / .55)}
.cat .ar{font-weight:800;color:var(--navy);font-size:1.02rem;line-height:1.3}
.cat .enl{font-size:.78rem;color:var(--gold-deep);font-weight:700;letter-spacing:.6px;text-transform:uppercase;direction:ltr}
.cat .cnt{font-size:.75rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.cat{transition:none}.cat:hover{transform:none}}
.sechead{display:flex;align-items:center;gap:12px}
.sechead::before,.sechead::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.sechead h2{font-size:1.25rem}
/* tabs & chips */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;white-space:nowrap;cursor:pointer;font-weight:700;color:var(--navy);display:inline-flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:inset 0 -2px 0 var(--gold)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;white-space:nowrap;cursor:pointer;font-size:.9rem;font-weight:600;color:var(--navy)}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:inset 0 -2px 0 var(--gold)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.status{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:999px;border:1px solid}
.st-pending{color:var(--wait);border-color:#E7D18A;background:var(--gold-soft)}
.st-accepted{color:var(--ok);border-color:#A9D3B8;background:#EDF7F0}
.st-done{color:var(--navy);border-color:var(--mist);background:var(--navy-soft)}
.st-rejected,.st-suspended{color:var(--bad);border-color:#E3B9B6;background:#FBEDEC}
.st-cancelled{color:var(--off);border-color:var(--line);background:#F2F4F7}
.st-active{color:var(--ok);border-color:#A9D3B8;background:#EDF7F0}
.st-new{color:var(--wait);border-color:#E7D18A;background:var(--gold-soft)}
.st-resolved{color:var(--off);border-color:var(--line);background:#F2F4F7}
/* shop list */
.search{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 12px;box-shadow:var(--shadow)}
.search input{border:0;background:transparent;flex:1;min-width:0;padding:10px 0;outline:none}
.shop{display:flex;gap:14px;align-items:center;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;box-shadow:var(--shadow)}
.shop:hover{border-color:var(--gold)}
.shop .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.shop .name{font-weight:800;font-size:1.05rem;color:var(--navy)}
.av{width:62px;height:62px;border-radius:14px;flex:none;object-fit:cover;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-family:var(--font-display);font-size:1.6rem;font-weight:800}
.stars{color:var(--gold);letter-spacing:1px;font-size:.92rem}
.price{color:var(--gold-deep);font-weight:800}
.empty{background:var(--card);border:1px dashed var(--mist);border-radius:var(--r);padding:24px;text-align:center;color:var(--muted)}
.hero-img{width:100%;aspect-ratio:16/8;max-width:100%;border-radius:var(--r);object-fit:cover;background:radial-gradient(120% 140% at 100% 0%,#16407A,var(--navy-deep));display:grid;place-items:center;color:var(--gold);font-family:var(--font-display);font-size:3.4rem;font-weight:800}
.svc{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.svc:has(input:checked){border-color:var(--gold);background:var(--gold-soft)}
.svc input{width:20px;height:20px;accent-color:var(--navy);flex:none}
.svc .n{flex:1;min-width:0;font-weight:600}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.slots .chip{text-align:center}
/* ticket */
.ticket{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.ticket .tp{padding:16px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;background:radial-gradient(120% 160% at 100% 0%,#16407A,var(--navy) 50%,var(--navy-deep));color:#fff}
.ticket .when{font-family:var(--font-display);font-size:1.9rem;font-weight:800;line-height:1.1;color:var(--gold)}
.ticket .perf{height:0;border-top:2px dashed var(--mist);margin-inline:14px}
.ticket dl{margin:0;padding:12px 16px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.93rem}
.ticket dt{color:var(--muted)} .ticket dd{margin:0;min-width:0}
.total{font-weight:800;color:var(--gold-deep);font-variant-numeric:tabular-nums}
/* lists */
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.item .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.item .ttl{font-weight:800;color:var(--navy)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.slotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.sl{border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 10px;display:flex;flex-direction:column;gap:4px;text-align:center}
.sl.closed{background:#F2F4F7;color:var(--off)}
.sl.full{background:var(--gold-soft)}
.sl .t{font-weight:700}
/* dashboard */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px}
.stat .si{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--navy-soft);color:var(--navy);margin-bottom:4px}
.stat .v{font-family:var(--font-display);font-size:1.7rem;font-weight:800;color:var(--navy);line-height:1.15;font-variant-numeric:tabular-nums}
.stat .l{font-size:.82rem;color:var(--muted);font-weight:600}
.stat .d{font-size:.78rem;font-weight:700}
.up{color:var(--ok)} .down{color:var(--bad)}
.chart{width:100%;height:auto;display:block}
.appt{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.appt:last-child{border-bottom:0}
.appt .tm{font-weight:800;color:var(--navy);min-width:70px}
.appt .nm{flex:1;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.hours{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:center}
.hours label.f{flex-direction:row;align-items:center;gap:6px;color:var(--ink)}
.svc-edit{display:grid;grid-template-columns:1fr 90px 80px auto;gap:6px;align-items:end}
@media (max-width:480px){.svc-edit{grid-template-columns:1fr 1fr}.svc-edit>label:first-child{grid-column:1/-1}}
/* notes: a different look from normal text */
.note{position:relative;background:var(--gold-soft);border:1px solid #EEDFA8;border-inline-start:4px solid var(--gold);border-radius:12px;padding:12px 14px 12px 14px;padding-inline-start:42px;font-size:.9rem;color:var(--navy);font-weight:600}
.note::before{content:"i";position:absolute;inset-inline-start:12px;top:12px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:var(--navy-deep);font:800 13px/20px Georgia,serif;text-align:center}
.note.ok{background:#EDF7F0;border-color:#BFE0CB;border-inline-start-color:var(--ok)}
.note.ok::before{content:"✓";background:var(--ok);color:#fff;font-family:inherit}
/* install */
.install{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--gold);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.install svg{flex:none}
.install .it{flex:1;min-width:150px;display:flex;flex-direction:column;gap:2px}
.install .it strong{color:var(--navy)}
.bigask{background:radial-gradient(120% 140% at 100% 0%,#16407A,var(--navy) 50%,var(--navy-deep));color:#fff;border-radius:22px;padding:20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;box-shadow:0 10px 30px rgb(7 31 66 / .25)}
.bigask h3{color:var(--gold);font-size:1.3rem}
.bigask p{margin:0;color:#D5DEEC}
ol.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px;counter-reset:s}
ol.steps li{counter-increment:s;display:flex;flex-direction:column;gap:8px}
ol.steps li>.t{display:flex;gap:10px;align-items:flex-start;font-weight:600}
ol.steps li>.t::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-weight:800;font-size:.9rem}
.pic{width:100%;max-width:340px;align-self:center;border-radius:14px;border:1px solid var(--line);background:#fff}
.kbd{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 8px;font-weight:700}
.ios-arrow{position:fixed;bottom:calc(6px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:30;color:var(--gold);filter:drop-shadow(0 2px 4px rgb(0 0 0 / .4));animation:bob 1s ease-in-out infinite;pointer-events:none}
@keyframes bob{50%{transform:translate(-50%,8px)}}
@media (prefers-reduced-motion:reduce){.ios-arrow{animation:none}}
/* footer: complaints & suggestions, separate dark block */
footer{margin-top:8px;background:var(--navy-deep);color:#E6ECF5;border-top:3px solid var(--gold)}
footer .in{max-width:1080px;margin:0 auto;padding:22px 16px 30px;display:flex;flex-direction:column;gap:10px}
footer h3{font-size:1.15rem;color:var(--gold)}
footer .muted{color:#AFC0D8}
footer .phone{color:#fff}
footer .kv dt{color:#AFC0D8}
footer .btn{background:transparent;color:#fff;border-color:rgb(255 255 255 / .3)}
footer .btn.pri{background:var(--gold);color:var(--navy-deep);border-color:var(--gold)}
footer .btn.wa{background:#1F7A45;border-color:#1F7A45}
footer .fbrand{display:flex;align-items:center;gap:10px;padding-top:10px;border-top:1px solid rgb(255 255 255 / .12)}
/* sheet + toast */
.scrim{position:fixed;inset:0;background:rgb(7 31 66 / .55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim.center{align-items:center;padding:16px 12px 70px}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.scrim.center .sheet{border-radius:22px;max-height:100%}
@media (min-width:720px){.scrim{align-items:center}.sheet{border-radius:22px;max-height:88%}}
.sheet .sh{position:sticky;top:0;background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;z-index:1}
.sheet .sh .btn{background:transparent;color:#fff;border-color:rgb(255 255 255 / .3)}
.sheet .sb{padding:16px;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline:16px;max-width:440px;margin:0 auto;background:var(--navy);color:#fff;border:1px solid var(--gold);padding:12px 16px;border-radius:14px;z-index:40;text-align:center;font-size:.92rem;box-shadow:0 6px 20px rgb(0 0 0 / .22)}
.spinner{width:28px;height:28px;border:3px solid var(--mist);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t th,table.t td{padding:8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
table.t th{color:var(--muted);font-weight:600}
.scrollx{overflow-x:auto}

/* ===== v4.0 premium look (mobile first) ===== */
.wrap.wide{max-width:1080px}
.secs{display:flex;flex-direction:column;gap:22px}
.secs>*{min-width:0}
.phero{position:relative;isolation:isolate;overflow:hidden;border-radius:24px;min-height:360px;padding:22px 18px 20px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;box-shadow:0 14px 34px rgb(7 31 66 / .3)}
.phero>.art{position:absolute;inset:0;width:100%;height:100%;z-index:-2}
.phero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgb(6 26 56 / .96) 0%,rgb(6 26 56 / .7) 42%,rgb(6 26 56 / .05) 78%)}
.phero h1{font-size:clamp(1.9rem,8vw,3rem);color:#fff;line-height:1.2}
.phero h1 .g{color:var(--gold);display:block}
.phero p{margin:0;color:#DCE4F1;max-width:40ch}
.phero.center{align-items:center;text-align:center}
.phero.center p{margin-inline:auto}
@media (min-width:720px){.phero{min-height:430px;padding:36px 34px 30px}}
.kicker{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:rgb(212 175 55 / .16);border:1px solid rgb(212 175 55 / .55);color:var(--gold);border-radius:999px;padding:2px 12px;font-size:.8rem;font-weight:700}
.phero.center .kicker{align-self:center}
.search.big{padding:6px 8px 6px 14px;border-radius:16px;border:2px solid var(--gold);box-shadow:0 8px 22px rgb(0 0 0 / .25);margin-top:4px;color:var(--navy)}
.search.big input{font-size:1rem;color:var(--ink)}
.search.big svg{flex:none;color:var(--gold-deep)}
.pcats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:720px){.pcats{grid-template-columns:repeat(3,1fr);gap:16px}}
.pcat{position:relative;isolation:isolate;overflow:hidden;aspect-ratio:1/1.05;border:0;border-radius:20px;padding:0;cursor:pointer;color:#fff;text-align:start;box-shadow:0 8px 22px rgb(7 31 66 / .18);background:var(--navy)}
@media (min-width:720px){.pcat{aspect-ratio:4/3.3}}
.pcat>.art{position:absolute;inset:0;width:100%;height:100%;z-index:-2;transition:transform .45s ease}
.pcat::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgb(6 26 56 / .92) 0%,rgb(6 26 56 / .35) 45%,transparent 70%);border-radius:inherit;box-shadow:inset 0 0 0 1.5px rgb(212 175 55 / .35)}
.pcat:hover>.art,.pcat:focus-visible>.art{transform:scale(1.06)}
.pcat .lbl{position:absolute;inset-inline:12px;bottom:10px;display:flex;flex-direction:column;line-height:1.25}
.pcat .ar{font-weight:800;font-size:1.12rem}
.pcat .enl{font-size:.74rem;color:var(--gold);font-weight:700;letter-spacing:.8px;text-transform:uppercase;direction:ltr;text-align:start}
.pcat .cnt{position:absolute;top:10px;inset-inline-start:10px;background:rgb(6 26 56 / .7);border:1px solid rgb(212 175 55 / .6);color:var(--gold);border-radius:999px;padding:0 10px;font-size:.74rem;font-weight:700;backdrop-filter:blur(4px)}
.pcat .cnt:empty{display:none}
@media (prefers-reduced-motion:reduce){.pcat>.art{transition:none}}
.feats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:720px){.feats{grid-template-columns:repeat(4,1fr);gap:14px}}
.feat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.feat .fi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--navy);color:var(--gold);box-shadow:inset 0 0 0 1.5px rgb(212 175 55 / .5)}
.feat strong{color:var(--navy);font-size:1rem;line-height:1.35}
.feat span{font-size:.84rem;color:var(--muted);line-height:1.5}
.how{display:grid;grid-template-columns:1fr;gap:10px;counter-reset:h}
@media (min-width:720px){.how{grid-template-columns:repeat(3,1fr);gap:14px}}
.how>div{position:relative;counter-increment:h;display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.how>div::before{content:counter(h);flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#E3C55E,var(--gold) 55%,var(--gold-deep));color:var(--navy-deep);font-weight:800;font-size:1.15rem}
.how strong{color:var(--navy);display:block}
.how span{font-size:.86rem;color:var(--muted)}
.join{position:relative;isolation:isolate;overflow:hidden;border-radius:24px;padding:24px 18px;color:#fff;display:flex;flex-direction:column;gap:10px;align-items:flex-start;background:radial-gradient(120% 140% at 0% 0%,#16407A 0%,var(--navy) 45%,var(--navy-deep) 100%);border:1.5px solid rgb(212 175 55 / .6);box-shadow:0 14px 34px rgb(7 31 66 / .28)}
.join::after{content:"";position:absolute;z-index:-1;inset-inline-end:-70px;top:-70px;width:240px;height:240px;border-radius:50%;border:24px solid rgb(212 175 55 / .12)}
.join h2{color:var(--gold);font-size:1.7rem}
.join p{margin:0;color:#DCE4F1;max-width:46ch}
.join .ji{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:rgb(212 175 55 / .15);color:var(--gold);border:1px solid rgb(212 175 55 / .5)}
.cathead{position:relative;isolation:isolate;overflow:hidden;border-radius:22px;min-height:150px;padding:18px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 10px 26px rgb(7 31 66 / .22)}
.cathead>.art{position:absolute;inset:0;width:100%;height:100%;z-index:-2}
.cathead::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgb(6 26 56 / .95),rgb(6 26 56 / .2) 75%)}
.cathead h2{color:#fff;font-size:1.6rem}
.cathead p{margin:0;color:#DCE4F1;font-size:.9rem}
.cathead .enl{color:var(--gold);font-weight:700;letter-spacing:.8px;font-size:.78rem;text-transform:uppercase}
.hero-img.hasart{position:relative;overflow:hidden}
.hero-img.hasart>.art{position:absolute;inset:0;width:100%;height:100%}
/* owner panel: sidebar on desktop, bottom tabs on the phone */
.olay{display:flex;flex-direction:column;gap:16px}
.omain{min-width:0;display:flex;flex-direction:column;gap:16px}
.oside{display:none}
.av.sm{width:44px;height:44px;font-size:1.2rem;border-radius:12px}
.onav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:#C9D3E1;padding:10px 12px;border-radius:12px;cursor:pointer;font-weight:700;text-align:start}
.onav:hover{background:rgb(255 255 255 / .07);color:#fff}
.onav[aria-current="page"]{background:linear-gradient(135deg,#E3C55E,var(--gold) 55%,var(--gold-deep));color:var(--navy-deep)}
.onav span:not(.badge){flex:1}
.oshop{display:flex;align-items:center;gap:10px;padding:4px 4px 12px;margin-bottom:6px;border-bottom:1px solid rgb(255 255 255 / .12);color:#fff}
.oshop strong{display:block;line-height:1.3}
.oshop small{color:#AFC0D8}
.bnav{position:fixed;bottom:0;inset-inline:0;z-index:15;background:var(--navy-deep);border-top:2px solid var(--gold);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 18px rgb(0 0 0 / .18)}
.bnav button{position:relative;background:none;border:0;color:#AFC0D8;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;font-size:.72rem;font-weight:700;cursor:pointer;min-height:58px}
.bnav button[aria-current="page"]{color:var(--gold)}
.bnav button[aria-current="page"]::before{content:"";position:absolute;top:0;inset-inline:22%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.bnav .badge{position:absolute;top:4px;inset-inline-start:calc(50% + 4px)}
body:has(.bnav) footer .in{padding-bottom:96px}
body:has(.bnav) .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){
  .olay{display:grid;grid-template-columns:250px 1fr;align-items:start;gap:20px}
  .oside{display:flex;flex-direction:column;gap:4px;position:sticky;top:84px;background:var(--navy);border:1px solid rgb(212 175 55 / .35);border-radius:20px;padding:14px;box-shadow:0 10px 26px rgb(7 31 66 / .2)}
  .bnav,.otabs-m{display:none}
  body:has(.bnav) footer .in{padding-bottom:30px}
  body:has(.bnav) .toast{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
}
/* forgot password */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--navy-soft);border-radius:14px;padding:4px}
.seg button{border:0;background:transparent;border-radius:11px;padding:10px 8px;font-weight:700;color:var(--navy);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--gold);box-shadow:0 3px 10px rgb(7 31 66 / .2)}

/* v4.0: hours editor, durations, branches, review pop-ups */
.hrs{display:flex;flex-direction:column;gap:8px}
.hday{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;display:flex;flex-direction:column;gap:8px}
.hday:has([data-hk=open]:not(:checked)){background:#F4F6F9}
.hday:has([data-hk=open]:not(:checked)) .htimes,.hday:has([data-hk=open]:not(:checked)) .allday{display:none}
label.f.inl{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:.95rem}
label.f.inl input{width:20px;height:20px;accent-color:var(--navy)}
.allday{border:1.5px solid var(--gold);border-radius:999px;padding:2px 12px;color:var(--gold-deep)!important;font-weight:700}
.htimes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.durs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.durs .chip{text-align:center;padding:10px 4px;font-weight:700}
.bgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:720px){.bgrid{grid-template-columns:repeat(3,1fr)}}
.bcard{position:relative;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden;cursor:pointer;padding:0;text-align:start;box-shadow:var(--shadow);color:inherit}
.bcard:hover{border-color:var(--gold)}
.bcard .bimg{position:relative;aspect-ratio:16/10;background:var(--navy);overflow:hidden}
.bcard .bimg>.art,.bcard .bimg>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bcard .bimg .status,.bcard .bimg .badge{position:absolute;top:8px}
.bcard .bimg .status{inset-inline-start:8px;background:#fff}
.bcard .bimg .badge{inset-inline-end:8px;min-width:24px;height:24px;font-size:.8rem}
.bcard .bt{padding:10px 12px;display:flex;flex-direction:column;gap:1px}
.bcard .bt strong{color:var(--navy);line-height:1.35}
.bcard .bt span{font-size:.8rem;color:var(--muted)}
.bcard.add{align-items:center;justify-content:center;gap:8px;min-height:150px;border:2px dashed var(--gold);background:var(--gold-soft);color:var(--gold-deep);font-weight:800}
.bcard.add .plus{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:var(--gold);font-size:2rem;line-height:1}
.umb{position:relative;isolation:isolate;overflow:hidden;border-radius:22px;padding:20px 18px;color:#fff;display:flex;gap:14px;align-items:center;background:radial-gradient(120% 140% at 100% 0%,#16407A 0%,var(--navy) 45%,var(--navy-deep) 100%);border:1.5px solid rgb(212 175 55 / .55);box-shadow:0 12px 30px rgb(7 31 66 / .25)}
.umb .ui{flex:none;width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:rgb(212 175 55 / .15);border:1px solid rgb(212 175 55 / .55);color:var(--gold);font-size:1.8rem;font-weight:800}
.umb h2{color:#fff;font-size:1.45rem}
.umb .muted{color:#C9D3E1}
.umb .btn{background:transparent;color:var(--gold);border-color:rgb(212 175 55 / .6)}
.shop.brandrow{border-color:rgb(212 175 55 / .6);background:linear-gradient(0deg,var(--card),var(--card)) padding-box}
.avs{position:relative;width:62px;height:62px;flex:none}
.avs .av{position:absolute;width:50px;height:50px;font-size:1.3rem;border:2px solid #fff}
.avs .av:first-child{top:0;inset-inline-start:0;z-index:2}
.avs .av:nth-child(2){bottom:0;inset-inline-end:0}
.brpill{display:inline-flex;align-items:center;gap:4px;background:var(--navy);color:var(--gold);border-radius:999px;padding:0 10px;font-size:.75rem;font-weight:700}
.sibs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.sib{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:6px 12px 6px 6px;cursor:pointer;text-align:start}
.sib:hover{border-color:var(--gold)}
.sib .av{width:38px;height:38px;font-size:1rem;border-radius:10px}
.sib strong{display:block;color:var(--navy);font-size:.9rem;line-height:1.3}
.sib span{font-size:.75rem;color:var(--muted)}
.bigstars{display:flex;justify-content:center;gap:4px;direction:ltr}
.bigstars button{background:none;border:0;cursor:pointer;font-size:2.6rem;line-height:1;color:var(--mist);padding:2px 4px;transition:transform .12s}
.bigstars button.on{color:var(--gold);text-shadow:0 2px 6px rgb(212 175 55 / .4)}
.bigstars button:active{transform:scale(1.2)}
.askhead{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.askhead .ai{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:var(--gold);box-shadow:inset 0 0 0 2px rgb(212 175 55 / .6)}
.askhead h3{font-size:1.3rem}
.revbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:linear-gradient(135deg,#FFF8DE,var(--gold-soft));border:1.5px solid var(--gold);border-radius:16px;padding:12px 14px}
.revbar .rs{font-size:1.6rem;color:var(--gold)}
.revbar .rt{flex:1;min-width:150px;font-weight:700;color:var(--navy)}

/* v4.0: logo, banner, gallery */
.pics{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start}
.pbox{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted);font-weight:600}
.pbox .pv{position:relative;border:2px dashed var(--mist);border-radius:14px;background:var(--navy-soft);display:grid;place-items:center;overflow:hidden;color:var(--navy);cursor:pointer}
.pbox .pv img{width:100%;height:100%;object-fit:cover}
.pbox .pv.logo{width:96px;height:96px;border-radius:22px}
.pbox .pv.ban{width:100%;aspect-ratio:2/1}
.pbox input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:720px){.gal{grid-template-columns:repeat(4,1fr)}}
.gal .g{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--navy-soft);border:0;padding:0;cursor:pointer}
.gal .g img{width:100%;height:100%;object-fit:cover;display:block}
.gal .g .x{position:absolute;top:4px;inset-inline-end:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgb(6 26 56 / .8);color:#fff;font-size:1rem;cursor:pointer}
.gal .add{display:grid;place-items:center;border:2px dashed var(--gold);background:var(--gold-soft);color:var(--gold-deep);font-weight:800;font-size:.85rem;text-align:center;position:relative}
.gal .add input{position:absolute;inset:0;opacity:0;cursor:pointer}
.shophero{position:relative}
.shophero .lg{position:absolute;bottom:-26px;inset-inline-start:16px;width:72px;height:72px;border-radius:20px;border:3px solid #fff;object-fit:cover;background:var(--navy);box-shadow:0 6px 16px rgb(7 31 66 / .25);display:grid;place-items:center;color:var(--gold);font-size:1.8rem;font-weight:800}
.shophero+.card{padding-top:34px}
.strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory}
.strip button{flex:none;width:42%;max-width:220px;aspect-ratio:4/3;border-radius:14px;overflow:hidden;border:0;padding:0;cursor:pointer;scroll-snap-align:start;background:var(--navy-soft)}
.strip img{width:100%;height:100%;object-fit:cover;display:block}
.viewer{display:flex;flex-direction:column;gap:10px}
.viewer img{width:100%;max-height:70vh;object-fit:contain;border-radius:12px;background:#000}

/* ===== v5.0 ===== */
.brand .word{white-space:nowrap}
@media (max-width:430px){.brand .word{font-size:1.1rem}.brand svg{width:34px;height:34px}.brand{gap:7px}.navbtns{gap:4px}.top .btn.sm{padding:6px 9px;font-size:.84rem}.top .in{padding-inline:10px;gap:6px}}
.gold{color:var(--gold)}
.dsk{display:none}@media (min-width:900px){.dsk{display:block}}
h4{margin:0;font-size:1rem;color:var(--navy);display:flex;align-items:center;gap:6px}
.homebtn svg{flex:none}
@media (max-width:480px){.homebtn .hl{display:none}.homebtn{padding-inline:9px}}
.rng{font-weight:700;color:var(--navy);white-space:nowrap}
.dchips{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:middle}
.dchip{display:inline-grid;place-items:center;min-width:26px;height:24px;padding:0 6px;border-radius:7px;border:1.5px solid var(--gold);color:var(--gold-deep);font-weight:800;font-size:.8rem;background:var(--gold-soft)}
/* social links */
.socials{display:flex;gap:8px;flex-wrap:wrap}
.soc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 10px;text-decoration:none;color:var(--navy);font-weight:700;font-size:.88rem;background:#fff}
.soc:hover{border-color:var(--gold)}
.soc .en{font-size:.72rem;color:var(--muted);font-weight:600}
.sd{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--navy)}
.soc-ig .sd,.sd.soc-ig{background:#C13584}.soc-tt .sd,.sd.soc-tt{background:#111}.soc-fb .sd,.sd.soc-fb{background:#1877F2}
.socbox,.devbox{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;background:#FBFCFE}
.devbox{border-color:rgb(212 175 55 / .6);background:var(--gold-soft)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:600px){.grid3{grid-template-columns:1fr}}
.fx{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted);font-weight:600;min-width:0}
/* + / − counters */
.cnt{display:inline-flex;align-items:center;gap:0;border:1.5px solid var(--gold);border-radius:12px;overflow:hidden;background:#fff;align-self:flex-start}
.cnt .cb{width:42px;height:40px;border:0;background:var(--navy);color:var(--gold);font-size:1.3rem;font-weight:800;cursor:pointer;line-height:1}

.svc-edit{grid-template-columns:1fr 90px auto auto}

.hallp>span:first-child{display:flex;align-items:center;gap:6px;font-weight:800;color:var(--navy)}
.hallp strong{color:var(--gold-deep);font-size:1.15rem}.hallp small{font-size:.75rem;color:var(--muted);font-weight:600}
.hallp.vip{border-color:var(--gold);background:var(--gold-soft)}
.devmap{background:radial-gradient(120% 120% at 100% 0%,#13325F,var(--navy-deep) 60%,#04142C);border:1px solid rgb(212 175 55 / .45);border-radius:18px;padding:14px;color:#fff;display:flex;flex-direction:column;gap:10px}
.devtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.devtop strong{display:block;color:var(--gold);font-size:1.1rem}.devtop span{font-size:.82rem;color:#C9D3E1}
.devmap .cnt{background:transparent}.devmap .cnt output{color:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:#C9D3E1}
.card .legend,.hpanel .legend{color:inherit}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.lg-free{border:1.5px solid #7D8BA3;background:transparent}.lg-on{background:linear-gradient(135deg,#E3C55E,var(--gold-deep))}.lg-busy{background:#5A2A2D;border:1px solid #8E4A4D}.lg-off{background:#3A4356;border:1px dashed #8A93A3}.lg-busy2{background:#1E5A3C;border:1px solid #3F9C6B}
.hallh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;font-size:.92rem;border-top:1px solid rgb(212 175 55 / .25);padding-top:8px}

function go(view, params = {}, push = true) {

  S.view = view; S.params = params;

  window.scrollTo(0, 0);
  render();
}
window.addEventListener("popstate", e => { const st = e.state; if (st && st.view) go(st.view, st.params || {}, false); else go(homeView(), {}, false); });
function homeView() {

      ${mode === "register" ? `<label class="f">الإيميل (اختياري)<input id="a-email" type="email" inputmode="email" autocomplete="email" dir="ltr" maxlength="100" placeholder="name@gmail.com"><span class="small muted" style="font-weight:400">بيساعدنا نعرفك لو نسيت كلمة السر.</span></label>` : ""}
      <label class="f">كلمة السر<input id="a-pass" type="password" autocomplete="${mode === "register" ? "new-password" : "current-password"}" dir="ltr" minlength="6" required></label>
      <div class="err" id="a-err" role="alert"></div>
      <button class="btn pri block" type="submit" id="a-go">${mode === "register" ? "اعمل الحساب" : "ادخل"}</button>
      ${mode === "login" ? `<button class="btn switch sm" type="button" data-act="forgot" style="align-self:flex-start">نسيت كلمة السر؟</button>` : `<p class="muted small" style="margin:0">رقمك هيظهر بس للمكان اللي تحجز فيه، عشان يأكد معاك.</p>`}

  <div class="row between">
    <button class="btn switch sm" data-act="pickrole" data-role="${isB ? "customer" : "barber"}">${isB ? "ادخل كعميل · Customer" : "ادخل كصاحب مكان · Business owner"}</button>
    ${!isB ? `<button class="btn switch sm" data-act="cats">اتفرّج على الأماكن الأول</button>` : ""}
  </div></div>`;
  $("#authform").addEventListener("submit", async e => {
    e.preventDefault();
    const err = $("#a-err"), btn = $("#a-go"); err.textContent = "";

function brandRow(g, cat) {

}

  if (!all.length) return;

// v5.0: a booking holds 1 seat, or one seat per device; giving it back also frees its device numbers
function giveBack(sd, b) {
  const up = { count: Math.max(0, (sd.count || 0) - bkN(b)) }, dv = bkDevs(b);
  if (dv.length) { const t = (sd.taken || []).slice(); dv.forEach(i => { const k = t.indexOf(i); if (k >= 0) t.splice(k, 1); }); up.taken = t; }
  return up;
}
function takeAgain(sd, b) { const up = { count: (sd.count || 0) + bkN(b) }; if (bkDevs(b).length) up.taken = (sd.taken || []).concat(bkDevs(b)); return up; }
async function cancelBooking(id, auto) {
  const b = S.myBookings.find(x => x.id === id); if (!b) return;
  try {
    await fb.runTransaction(db, async tx => {
      const bref = fb.doc(db, "bookings", id), refs = bkSlots(b).map(x => fb.doc(db, "shops", b.shopId, "slots", x));
      const cur = await tx.get(bref), snaps = [];
      for (const r of refs) snaps.push(await tx.get(r));
      if (!["pending", "accepted"].includes(cur.data().status)) throw userErr("الحجز ده اتغيّرت حالته خلاص.");
      tx.update(bref, auto ? { status: "cancelled", auto: true, updatedAt: fb.serverTimestamp() } : { status: "cancelled", updatedAt: fb.serverTimestamp() });
      snaps.forEach((sd, i) => { if (sd.exists()) tx.update(refs[i], { ...giveBack(sd.data(), b), lastBooking: id }); });
    });
    if (auto) { notify("اتلغى حجزك تلقائياً", `${b.shopName} · عدّى ${n(LATE_MIN)} دقايق على المعاد`); return; }
    toast("اتلغى الحجز.");
    if (S.view === "booked") go("mybookings");
  } catch (e) { if (!auto) toast(errText(e)); }
}

async function downloadBackup(btn) {
  btn.disabled = true; const label = btn.textContent; btn.textContent = "بيجهّز النسخة…";
  try {
    const out = { app: "Dorak", version: APP_VERSION, at: new Date().toISOString(), collections: {} };
    const grab = async path => (await fb.getDocs(fb.collection(db, ...path))).docs.map(d => ({ id: d.id, ...d.data() }));
    for (const c of ["users", "admins", "shops", "bookings", "reviews", "feedback", "settings", "offers"]) out.collections[c] = await grab([c]);
    for (const sh of out.collections.shops) { sh._slots = await grab(["shops", sh.id, "slots"]); sh._photos = await grab(["shops", sh.id, "photos"]); }
    const url = URL.createObjectURL(new Blob([JSON.stringify(out)], { type: "application/json" })), a = document.createElement("a");
    a.href = url; a.download = `dorak-backup-${dkey(new Date())}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast("اتنزّلت النسخة الاحتياطية ✔");
  } catch (e) { toast(errText(e)); }
  btn.disabled = false; btn.textContent = label;
}

document.addEventListener("change", async e => {

  if (t.dataset.svc != null && bk) { const i = +t.dataset.svc; t.checked ? bk.svc.add(i) : bk.svc.delete(i); drawSummary(); }
  if (t.dataset.actChange === "adminbk") {
    const b = A.data.bookings.find(x => x.id === t.dataset.id); const prev = b.status, nx = t.value;
    try {
      await fb.runTransaction(db, async tx => {
        const refs = bkSlots(b).map(x => fb.doc(db, "shops", b.shopId, "slots", x)), snaps = [];
        for (const r of refs) snaps.push(await tx.get(r));
        tx.update(fb.doc(db, "bookings", b.id), { status: nx, updatedAt: fb.serverTimestamp() });
        const wasHolding = HOLD.includes(prev), holds = HOLD.includes(nx);
        if (wasHolding !== holds) snaps.forEach((sd, i) => { if (sd.exists()) tx.update(refs[i], holds ? takeAgain(sd.data(), b) : giveBack(sd.data(), b)); });

      if (S.knownPending) pend.filter(b => !S.knownPending.has(b.id)).forEach(b => notify("طلب حجز جديد", b.customerName + " · " + b.shopName + " · " + fmtDate(b.date) + " " + bkRange(b)));
      S.knownPending = new Set(pend.map(b => b.id));
      pend.forEach(b => { const pk = b.prop ? b.prop.by + b.prop.date + b.prop.time + (b.prop.ok ? 1 : 0) : ""; if (S.knownProps && b.prop && (b.prop.by === "customer" || b.prop.ok) && S.knownProps[b.id] !== pk) notify(b.prop.ok ? "العميل وافق على المعاد الجديد" : "العميل اقترح معاد تاني", b.customerName + " · " + fmtDate(b.prop.date) + " " + fmtT(b.prop.time)); (S.knownProps = S.knownProps || {})[b.id] = pk; });
      S.pendingCount = pend.length; renderTop();
      try { document.title = (pend.length ? "(" + pend.length + ") " : "") + "احجز دورك · Dorak"; } catch (e) {}
      if (S.view === "barber" && !S.params.add && S.shops !== undefined) { const tab = S.params.tab || "dash"; if (!S.shop || tab === "requests" || tab === "dash") vBarber(); else if (tab === "schedule" && S.schedDraw) S.schedDraw(); else if (tab === "hall" && S.hallDraw) S.hallDraw(); }
      setTimeout(ownerAskOnOpen, 1500); checkReminders(); autoProps();
    };
    S.roleUnsubs.push(fb.onSnapshot(fb.query(fb.collection(db, "bookings"), fb.where("ownerId", "==", uid)), snap => onBk("a", snap), () => {}));
    S.roleUnsubs.push(fb.onSnapshot(fb.query(fb.collection(db, "bookings"), fb.where("shopId", "==", uid)), snap => onBk("b", snap), () => {}));
  }
}

/* ---------------- boot ---------------- */
async function boot() {
  if (!CONFIGURED) { render(); return; }
  try {
    const [app, au, fs] = await Promise.all([import(SDK + "firebase-app.js"), import(SDK + "firebase-auth.js"), import(SDK + "firebase-firestore.js")]);
    fb = { ...au, ...fs };
    const fapp = app.initializeApp(firebaseConfig);
    auth = au.getAuth(fapp); db = fs.getFirestore(fapp);
  } catch (e) {
    main.innerHTML = `<div class="wrap"><div class="empty">مش قادرين نوصل للسيرفر. اتأكد من النت وافتح الصفحة تاني.</div><button class="btn pri" onclick="location.reload()">جرّب تاني</button></div>`; return;
  }
  fb.getDoc(fb.doc(db, "settings", "app")).then(d => { if (d.exists()) { S.settings = { ...DEFAULTS, ...d.data() }; if (S.settings.supportWhatsapp === "01029948329") { S.settings.supportWhatsapp = DEFAULTS.supportWhatsapp; S.settings.supportName = ""; } renderFoot(); } }).catch(() => {});
  fb.onAuthStateChanged(auth, async user => {
    S.user = user; S.profile = null; S.isAdmin = false; stopRoleListeners();
    if (user) {
      try {
        const [p, a] = await Promise.all([fb.getDoc(fb.doc(db, "users", user.uid)), fb.getDoc(fb.doc(db, "admins", user.uid)).catch(() => null)]);
        if (p.exists()) S.profile = p.data();
        else if (S.pendingProfile) S.profile = { ...S.pendingProfile, status: "active" };
        S.isAdmin = !!(a && a.exists());
      } catch (e) { if (S.pendingProfile) S.profile = { ...S.pendingProfile, status: "active" }; }
      S.pendingProfile = null;
      if (S.profile) { store("dawrak.role", S.profile.role); startRoleListeners(); }
    }
    const wasReady = S.ready; S.ready = true;
    if (S.afterLogin && S.profile) { const v = S.afterLogin, p = S.afterLoginParams; S.afterLogin = null; go(v, p); return; }
    if (!wasReady) {
      const h = (location.hash || "").slice(1);
      const v = ["home", "mybookings", "barber", "admin", "account"].includes(h) ? h : homeView();
      try { history.replaceState({ view: v, params: {} }, "", "#" + v); } catch (e) {}
      go(v, {}, false);
    } else if (S.view === "auth" || S.view === "welcome" || S.view === "profile" || !user) go(homeView());
    else render();
  });
}
render(); boot();
</script>
